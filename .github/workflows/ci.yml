name: CI

# Valida que el proyecto realmente instale y migre, en la infraestructura
# de GitHub Actions. Esto corre `composer install` contra Packagist real
# y `php artisan migrate` contra un Postgres de verdad, como la validación
# de punta a punta que no se pudo correr en el entorno donde se escribió
# el código (sin salida a Packagist).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  install-and-migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acs_exam_web
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, intl
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: |
          set +e
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee /tmp/composer-install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::composer install failed (exit $status). Tail of output:%0A$(tail -c 3000 /tmp/composer-install.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit "$status"
          fi
        shell: bash

      - name: Generate app key
        run: php artisan key:generate

      - name: Configure database connection
        run: |
          php artisan config:clear
          sed -i "s/^DB_HOST=.*/DB_HOST=127.0.0.1/" .env
          sed -i "s/^DB_PORT=.*/DB_PORT=5432/" .env
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=acs_exam_web/" .env
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=postgres/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=postgres/" .env

      - name: Lint PHP syntax
        run: find app database routes -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run migrations + seeders
        run: php artisan migrate --seed --force

      - name: Run test suite
        run: |
          set +e
          php artisan test 2>&1 | tee /tmp/artisan-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Este sandbox no puede leer los logs de Actions directamente
            # (gh run view --log / gh api .../logs están bloqueados), así
            # que la única forma de diagnosticar una falla es a través de
            # esta anotación ::error::. Para una excepción no capturada
            # (p. ej. "Undefined array key"), lo que importa es el PRIMER
            # frame del stack trace (dónde ocurrió realmente), no el final
            # de la salida — por eso se busca el bloque completo de cada
            # falla en vez de solo el tail.
            {
              echo "=== Primer bloque de falla (con stack trace completo) ==="
              grep -n -m1 -A 60 -E '^\s*[0-9]+\) Tests' /tmp/artisan-test.log
              echo "=== Resumen final ==="
              tail -n 15 /tmp/artisan-test.log
            } > /tmp/artisan-test-summary.log
            echo "::error::php artisan test failed (exit $status).%0A$(cat /tmp/artisan-test-summary.log | tail -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit "$status"
          fi
        shell: bash
